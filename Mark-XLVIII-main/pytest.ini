[pytest]
# Parallel by default. Measured on this host: ~313s serial -> ~170s across
# workers on the full suite.
#
# The suite is isolation-safe in parallel: the only shared mutable state is
# module-level caches that the tests owning them reset, and vault-touching tests
# build their own temp roots.
#
# Deliberately no `testpaths`. Setting it to `tests` looked tidy but silently
# dropped 6 collected tests from the vendored jarvis-ui-components package,
# which changes what the suite covers -- the point of this file is to make the
# same run faster, not smaller.
#
# For a single failing test, add `-n 0`: worker output interleaves, so
# tracebacks are much easier to read serially.
addopts = -n auto
