- step_id: v3_c5e31d
  orchestrator: deterministic
  step_type: command
  target: pytest_focused
  description: Run the project's full pytest suite once and report whether everything
    is green.
  risk_tier: T2
  side_effects: local_read
  depends_on: []
  inputs:
    canvas_role: verification
    canvas_node_id: v3
