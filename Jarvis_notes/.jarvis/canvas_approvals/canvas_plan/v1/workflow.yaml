schema_version: jarvis_dual_orchestrator/v1
workflow_id: canvas_plan
version: canvas-1
name: Canvas Plan
description: Compiled from an Obsidian Canvas graph (Mode 2 planning).
max_steps: 3
variables:
  source: canvas
  node_step_ids:
    create_spec_plan: create_spec_plan_2ed0a1
    read_script: read_script_da5af9
    write_spec_note: write_spec_note_25ce07
steps:
- step_id: create_spec_plan_2ed0a1
  orchestrator: deterministic
  step_type: gate
  target: plan_milestone
  description: "Create a detailed specification of the script E:\\Aletheia_project\\\
    DEV_TOOLS\\ToolSet\\aletheia_toolchain\\notebook_packager_v3.1.py covering purpose,\
    \ functions, classes, dependencies, inputs/outputs, invariants, edge cases, and\
    \ flag inferred information. This is a read\u2011only research and documentation\
    \ task; no code changes are made."
  risk_tier: T1
  side_effects: none
  depends_on: []
  inputs:
    canvas_role: plan
    canvas_node_id: create_spec_plan
  outputs:
    result: result.create_spec_plan_2ed0a1
  acceptance_criteria:
    required: true
- step_id: read_script_da5af9
  orchestrator: cognitive
  step_type: model_reasoning
  target: reasoning
  description: Open the file E:\Aletheia_project\DEV_TOOLS\ToolSet\aletheia_toolchain\notebook_packager_v3.1.py
    and thoroughly analyze its source. Identify the script's overall purpose, each
    function and class with its role, real dependencies between components, expected
    inputs and outputs, any invariants or edge cases handled, and note any aspects
    that are inferred rather than explicitly present in the code.
  risk_tier: T1
  side_effects: none
  depends_on:
  - create_spec_plan_2ed0a1
  inputs:
    canvas_role: research
    canvas_node_id: read_script
    prompt: "System goal: Create a detailed specification of the script E:\\Aletheia_project\\\
      DEV_TOOLS\\ToolSet\\aletheia_toolchain\\notebook_packager_v3.1.py covering purpose,\
      \ functions, classes, dependencies, inputs/outputs, invariants, edge cases\u2026\
      \n\nOpen the file E:\\Aletheia_project\\DEV_TOOLS\\ToolSet\\aletheia_toolchain\\\
      notebook_packager_v3.1.py and thoroughly analyze its source. Identify the script's\
      \ overall purpose, each function and class with its role, real dependencies\
      \ between components, expected inputs and outputs, any invariants or edge cases\
      \ handled, and note any aspects that are inferred rather than explicitly present\
      \ in the code."
    context_injected: true
    evidence:
    - bind:
        from_step: create_spec_plan_2ed0a1
        path: result.summary
  outputs:
    result: result.read_script_da5af9
  acceptance_criteria:
    required: true
- step_id: write_spec_note_25ce07
  orchestrator: deterministic
  step_type: gate
  target: reference_context
  description: "Using the analysis from the previous step, compose a comprehensive\
    \ specification document as a vault note. Structure the note with clear sections\
    \ for purpose, detailed descriptions of every function and class (including signatures,\
    \ responsibilities, and interactions), dependency graph, input/output contracts,\
    \ invariants, edge\u2011case handling, and a separate list of inferred items.\
    \ Save this note in the vault for future reference."
  risk_tier: T1
  side_effects: local_read
  depends_on:
  - read_script_da5af9
  inputs:
    canvas_role: reference
    canvas_node_id: write_spec_note
  outputs:
    result: result.write_spec_note_25ce07
  acceptance_criteria:
    required: true
